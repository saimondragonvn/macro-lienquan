name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.4.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.4.0' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.4.0' }})
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 💎 ĐẠI TU TOÀN DIỆN GIAO DIỆN LIQUID GLASS & CYBER HUD:
            1. **MẶT KÍNH ACRYLIC MỜ ĐỤC CÓ CHIỀU SÂU (FROSTED ACRYLIC GLASS SURFACES)**:
               - Nâng cấp toàn bộ thẻ giao diện, bảng điều khiển menu và hộp thoại sang cấu trúc kính acrylic đa lớp với độ trong suốt tối ưu (75-85%).
            2. **VIỀN PHẢN QUANG TINH THỂ KÍNH (SPECULAR GLASS RIM LIGHTS)**:
               - Viền phản xạ ánh sáng Specular Rim Light 1.2dp quanh mép các khối kính, mô phỏng ánh sáng phản chiếu chân thực khi chạm vào mép cắt của kính cường lực.
            3. **HỆ THỐNG NÚT BẤM KHỐI CẦU KÍNH NỔI (LIQUID GLASS ORBS HUD BUTTONS)**:
               - Nút bấm combo trên màn hình game (`FloatingTriggerView`) được nâng cấp thành các quả cầu kính thể lỏng (Liquid Glass Orbs) với hiệu ứng gradient 3D dạng thấu kính, viền hào quang phát quang (Cyan Neon Glow `2dp`).
               - Trạng thái xả combo: Lõi cầu kính phát sáng ngọc lục bảo rực lửa (`Radiant Emerald Power Core`) với viền hào quang trắng sáng (`White Specular Rim`).
            4. **THANH ĐIỀU KHIỂN CAPSULE DYNAMIC ISLAND**:
               - Nâng cấp thanh điều khiển ghi combo và thanh chỉnh sửa vị trí nút thành dạng viên con nhộng Liquid Capsule (`radius = 999dp`).
            5. **BẢO LƯU 100% CÁC TÍNH NĂNG CHỦ LỰC**:
               - Khóa vị trí trong trận đấu, chế độ di chuyển nút khi mở menu, chỉnh tốc độ cơ động lên tới 20x, thanh thông báo tiện ích điều khiển, động cơ Shizuku Binder 120Hz.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.4.0.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
