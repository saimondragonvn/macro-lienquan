name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Fast Combo Controller) - Bản Release v1.1.0
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🌟 ĐIỂM MỚI NỔI BẬT TRÊN BẢN v1.1.0:
            1. **Trình hướng dẫn kích hoạt kiểu Panda Touch Pro (`SetupWizardActivity`)**:
               - Hướng dẫn từng bước kích hoạt Shizuku qua Gỡ lỗi không dây (Wireless Debugging) / Wi-Fi Debugging.
               - Không cần root, không cần máy tính (Android 11+).
               - Tự động kiểm tra trạng thái quyền Shizuku & ADB thực thi trực tiếp trên máy.
            2. **Giao diện Xem trước quỹ đạo thao tác (`GesturePreviewCanvas`)**:
               - Sau khi ghi combo chiêu thức, hiển thị trực quan bản đồ thao tác (các điểm chạm tap, vuốt swipe, số thứ tự từng chiêu).
               - Hiển thị chính xác thời gian thực tế đã ghi và thời gian sau khi tăng tốc (1x - 10x).
            3. **Không crash khi dùng Shizuku/ADB**:
               - Hỗ trợ thực thi lệnh mô phỏng cảm ứng (`input tap`, `input swipe`) trực tiếp thông qua Shizuku IPC service mà không phụ thuộc vào AccessibilityService bị crash trên một số dòng máy.
               - Duy trì tính năng đa điểm: Tay trái điều khiển Joystick di chuyển bình thường trong lúc macro chạy combo.

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.1.0.apk`** ở mục **Assets** bên dưới về điện thoại.
            2. Mở file APK để cài đặt.
            3. Khởi động ứng dụng, làm theo **⚡ Hướng dẫn cài đặt** để kích hoạt Shizuku và cấp quyền Overlay hiển thị nổi.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
