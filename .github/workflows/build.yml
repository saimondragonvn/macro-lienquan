name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - TÁI CẤU TRÚC HOÀN TOÀN MỚI (Bản Release v2.0.0)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 ĐỘT PHÁ TÁI CẤU TRÚC TOÀN DIỆN TRONG BẢN v2.0.0:
            1. **KIẾN TRÚC MỚI TINH GỌN, ỔN ĐỊNH TUYỆT ĐỐI**:
               - Đập đi xây lại hoàn toàn service điều khiển cửa sổ nổi với `TurboOverlayService`: loại bỏ toàn bộ các lớp wrapper rườm rà, adapter, dialogs cũ.
               - Tự động thích ứng xoay màn hình ngang/dọc (`onConfigurationChanged`): Tối ưu hoàn hảo cho game xoay ngang như Liên Quân Mobile trên Infinix Note 30 và mọi dòng điện thoại khác!
            2. **ĐỘNG CƠ THỰC THI SHELLEXECUTOR 120HZ SIÊU TỐC**:
               - Chạy trực tiếp qua Shizuku hoặc Root `su` với cơ chế chuỗi lệnh bash liên tục, độ trễ 0ms.
               - Không bao giờ bị nghẽn lệnh hoặc văng ứng dụng.
            3. **GIAO DIỆN GAME TURBO HUD ĐẲNG CẤP**:
               - Tab mép màn hình `[⚡ TURBO]` tự hút dính mép viền, 1 chạm mở bảng điều khiển.
               - Gán vị trí chiêu: Bấm `[+ Ghim Điểm]` để kéo thả các điểm (1, 2, 3...) lên nút chiêu, sau đó bấm `[🚀 TẠO NÚT BẤM TURBO]` để tạo nút tròn `[⚡]`.
               - Chạm nút tròn `[⚡]` để xả combo cực nhanh, đè lâu để xóa nút.
            4. **LOẠI BỎ 100% TRỢ NĂNG (ACCESSIBILITY SERVICE)**:
               - Không còn bất kỳ rào cản trợ năng nào.

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v2.0.0.apk`** ở mục **Assets** bên dưới.
            2. Cài đặt vào điện thoại hoặc trình giả lập PC.
            3. Cấp quyền Cửa sổ nổi, bật Shizuku (hoặc Root), mở Game Turbo và chiến game!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
