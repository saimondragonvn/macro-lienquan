name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.3.1' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.3.1' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release v2.3.1)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 TÍNH NĂNG VÀ CẢI TIẾN TRỌNG TÂM TRÊN V2.3.1:
            1. **ẨN HOÀN TOÀN ICON TAB SÉT TURBO Ở MÉP MÀN HÌNH**:
               - Loại bỏ hoàn toàn thanh tab nổi `[⚡ TURBO]` treo ở mép màn hình khi chơi game, giúp màn hình game sạch sẽ, thông thoáng 100%.
            2. **MỞ MENU TURBO DẠNG TIỆN ÍCH THÔNG BÁO (CIRCLE TO SEARCH STYLE)**:
               - Vuốt thanh thông báo của điện thoại xuống và chạm vào thông báo hoặc nút `[⚡ MỞ MENU]`, bảng điều khiển Game Turbo HUD sẽ lập tức hiện ra giữa màn hình.
               - Bấm `[✕ Đóng]` là menu đóng hoàn toàn, không để lại bất kỳ icon nào trên màn hình.
            3. **KHẮC PHỤC TRIỆT ĐỂ LỖI NÚT NHẢY LOẠN KHI KÉO THẢ**:
               - Viết lại toàn bộ thuật toán dragging của Nút Combo và Điểm Ghim sử dụng tọa độ phần cứng `event.rawX` / `event.rawY`.
               - Di chuyển nút cực kỳ mượt mà, bám dính 1:1 theo ngón tay, kéo thả cơ động đến bất kỳ vị trí nào trên màn hình mà không bị giật hay nhảy loạn.
            4. **LƯU VỊ TRÍ NÚT CHUẨN XÁC, BẢO LƯU TỌA ĐỘ KHI XOAY NGANG**:
               - Khắc phục lỗi clamp tọa độ theo chiều dọc portrait, đảm bảo tọa độ chiêu thức trong game ngang không bị ép sai hay biến mất.
               - Ghi đĩa tức thì với cơ chế synchronous `commit()`, không bao giờ bị mất vị trí đã gán khi khởi động lại máy hay thoát game.
            5. **CHỈNH TỐC ĐỘ CƠ ĐỘNG BẰNG SỐ (GIỚI HẠN TỐI ĐA 20X)**:
               - Bổ sung ô nhập số tốc độ xả combo trực tiếp: Người dùng nhập 5 sẽ x5 tốc độ, nhập 10 sẽ x10 tốc độ (hỗ trợ từ 0.5x đến 20x).
               - Kèm các phím chọn nhanh: 1x, 2x, 5x, 10x, 20x cả trong hộp thoại lưu combo lẫn menu cài đặt nút.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.3.1.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
