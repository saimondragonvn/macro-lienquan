name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.2.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.2.0' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release v2.2.0)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 TÍNH NĂNG ĐỘT PHÁ MỚI - GHI COMBO CHUẨN REDMI TURBO 4 PRO:
            1. **ĐẬP ĐI XÂY LẠI TỪ SỐ 0 - ĐỘNG CƠ GHI COMBO KERNEL LINUX KHÔNG CHẶN MÀN HÌNH**:
               - Đọc luồng cảm ứng trực tiếp từ `/dev/input/event*` ngầm qua Shizuku/Root mà KHÔNG hề chiếm quyền cảm ứng của hệ thống.
               - Trong lúc ghi: Game thủ di chuyển, mở Shop, mua đồ, bán đồ, bấm chiêu 100% bình thường vào game Liên Quân!
               - Thanh điều khiển Capsule/Pill siêu gọn gàng ở đỉnh màn hình: `[ 🔴 GHI COMBO 00:03 | ⏹ XONG & LƯU | ✕ HỦY ]`.
               - Tự động nhận diện độ phân giải phần cứng và tính toán xoay ngang Landscape (xoay 90° và 270°).
            2. **NÚT NỔI COMBO [⚡ R1, R2...] XẢ CHIÊU 120HZ CỰC NHANH**:
               - Nhấn nút nổi là tự động bắn chuỗi thao tác thực tế vào game với độ trễ siêu thấp.
               - Hỗ trợ tùy chỉnh tốc độ combo (1.0x, 2.0x, 3.0x), độ mờ (30%, 50%, 80%, 100%) và số lần lặp.
            3. **CHỐNG SPAM NÚT TRIỆT ĐỂ & QUẢN LÝ DỄ DÀNG**:
               - Nút `[🗑️ XÓA TOÀN BỘ NÚT COMBO ĐÃ TẠO]` dọn sạch màn hình chỉ với 1 chạm.
               - Giới hạn tối đa 5 nút, tự căn chỉnh vị trí tránh đè lên nhau.
               - Hỗ trợ lưu trữ vĩnh viễn: tắt app mở lại vẫn giữ nguyên toàn bộ cấu hình.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.2.0.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
