name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.1' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.1' }}
          body: |
            ### 💧 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.1' }})
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 💎 GIAO DIỆN NÚT MACBO LIQUID GLASS (THỦY TINH LỎNG KHÔNG VIỀN):
            1. **LOẠI BỎ HOÀN TOÀN ĐƯỜNG VIỀN THÔ RÁP**:
               - Triệt tiêu 100% các nét stroke thô cứng xung quanh nút macro.
            2. **CHUẨN THỦY TINH LỎNG (LIQUID GLASS DROPLET)**:
               - Nền kính tinh thể trong suốt quang học cao (High Refraction Translucent Glass).
               - Vầng bóng gương bán nguyệt mặt trên tạo độ cong 3D tự nhiên như giọt nước.
               - Ánh sáng phản xạ tán sắc xanh ngọc (Chromatic Cyan Refraction) và hiệu ứng đáy giọt nước.
            3. **HIỆU ỨNG TƯƠNG TÁC XÚC GIÁC (TACTILE LIQUID BOUNCE)**:
               - Khi bấm bắn combo: Lõi ngọc bích phát sáng chói lọi cùng hiệu ứng nén đàn hồi giọt nước.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.5.1.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
