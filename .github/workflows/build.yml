name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.4' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.4' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Game Turbo HUD & Fast Combo) - Bản Release v1.2.4
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 ĐỘT PHÁ NÂNG CẤP TRONG BẢN v1.2.4:
            1. **LOẠI BỎ HOÀN TOÀN DỊCH VỤ TRỢ NĂNG (ACCESSIBILITY SERVICE)**:
               - Xóa sạch 100% mã nguồn Trợ năng, không còn thông báo yêu cầu quyền Trợ năng, không lo "Cài đặt bị hạn chế" làm phiền.
               - Động cơ thực thi chuyển sang 100% Shizuku / Gỡ lỗi qua Wi-Fi / Root: Chạy trực tiếp bằng privileged shell binder (`input tap X Y; sleep ...`) với độ trễ siêu thấp 0ms, không lag, không văng app.
            2. **GIAO DIỆN GAME TURBO HUD (REDMI / XIAOMI / REDMAGIC STYLE)**:
               - Dock nổi mép màn hình: Thu gọn thành tab nhỏ gọn `[⚡ TURBO]`, chạm là mở bảng điều khiển Game Turbo HUD.
               - Tính năng **Gán Vị Trí Chiêu (Target Combo)**: Bấm `[+ Ghim Điểm]`, kéo thả các điểm (1, 2, 3...) vào nút chiêu trong game, sau đó bấm `[🚀 TẠO NÚT BẤM TURBO]` là có ngay nút tròn trên màn hình.
               - Tính năng **Ghi Thao Tác (Macro Recorder)**: Bổ sung nút **[🔴 BẮT ĐẦU GHI (START)]** to rõ ràng, hiển thị thanh điều khiển với nút **[⏹️ DỪNG GHI (STOP)]**, nút Hoàn tác `[↩ Xóa]`, tự động tạo nút tròn Turbo ngay khi dừng ghi!
            3. **KHẮC PHỤC TRIỆT ĐỂ LỖI CRASH TRÊN INFINIX NOTE 30 / ANDROID 13 & 14**:
               - Loại bỏ hoàn toàn MaterialButton trong các cửa sổ overlay của Service (nguyên nhân gây lỗi theme style và crash "Ứng dụng đã dừng").
               - Nâng cấp cơ chế đóng View an toàn với kiểm tra `isAttachedToWindow`.

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.2.4.apk`** ở mục **Assets** bên dưới.
            2. Cài đặt vào điện thoại hoặc trình giả lập PC.
            3. Khởi động Shizuku (hoặc Root), mở app và tận hưởng tốc độ Game Turbo!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
