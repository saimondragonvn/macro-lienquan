name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.0' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.0' }})
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🎮 TÍNH NĂNG ĐA HỒ SƠ COMBO THEO TỪNG GAME (MULTI-GAME PROFILES):
            1. **HỒ SƠ CẤU HÌNH COMBO ĐỘC LẬP CHO TỪNG GAME**:
               - Mỗi game (Liên Quân Mobile, Free Fire, Tốc Chiến, Genshin...) sở hữu danh sách nút combo, vị trí tọa độ, độ trễ và độ mờ riêng biệt 100%.
            2. **CHUYỂN ĐỔI GAME 1-CHẠM TRÊN MENU & DASHBOARD**:
               - Thanh chọn game dạng thẻ kính (Chips) cuộn ngang trực quan: Chạm vào game nào là các nút combo của game đó lập tức xuất hiện đúng vị trí.
            3. **THÊM MỚI, ĐỔI TÊN & XÓA HỒ SƠ LINH HOẠT**:
               - Dễ dàng tạo hồ sơ cho bất kỳ tựa game nào với nút `[+ Thêm Game]`.
            4. **MỞ GAME THÔNG MINH THEO HỒ SƠ ĐANG CHỌN**:
               - Tự động nhận diện và khởi động chính xác tựa game đang được chọn.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.5.0.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
