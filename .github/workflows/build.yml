name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.3' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.3' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release v2.0.3)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 CẢI TIẾN ĐỘT PHÁ v2.0.3:
            1. **VỪA DI CHUYỂN (JOYSTICK) VỪA BẤM COMBO MƯỢT MÀ**:
               - Kích hoạt cờ `FLAG_SPLIT_TOUCH` trên toàn bộ cửa sổ nổi và xử lý `ACTION_POINTER_DOWN / ACTION_POINTER_UP`.
               - Giờ đây ngón cái tay trái kéo joystick đi chuyển tướng, ngón tay phải bấm nút combo `[⚡ C1]` hoàn toàn độc lập cùng lúc, không còn bị khựng hay đơ cảm ứng!
            2. **KHẮC PHỤC TRIỆT ĐỂ LỖI BẤM SHOP / CHIÊU KHÔNG MỞ TRONG GAME**:
               - Thay thế lệnh `input tap` (0ms thường bị game engine Unity/Tencent bỏ qua) bằng `input swipe X Y X Y 45ms` (chuẩn thời gian giữ ngón tay).
               - Nút Shop, nút Chiêu, nút Trang bị trong game nhận diện và phản hồi 100% tức thì!
            3. **GHI THAO TÁC TRỰC QUAN - TƯƠNG TÁC THỜI GIAN THỰC VÀO GAME**:
               - Khi bấm [Ghi Thao Tác]: Mỗi lần chạm vào màn hình (ví dụ bấm mở Shop, bấm mua đồ, bấm đóng shop) thì game sẽ THỰC SỰ PHẢN HỒI VÀ MỞ SHOP ngay tức khắc, đồng thời vẽ điểm đánh dấu số ①, ②, ③ trực tiếp trên màn hình!

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.0.3.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
