name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.5' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.5' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Game Turbo HUD & 120Hz Fast Combo) - Bản Release v1.2.5
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 KHẮC PHỤC TRIỆT ĐỂ LỖI CRASH VÀ NÂNG CẤP TOÀN DIỆN TRONG BẢN v1.2.5:
            1. **KHẮC PHỤC 100% NGUYÊN NHÂN CRASH VĂNG APP ("ỨNG DỤNG ĐÃ DỪNG")**:
               - Loại bỏ thẻ `<provider>` Shizuku thủ công chứa quyền hệ thống `INTERACT_ACROSS_USERS_FULL` trong Manifest (nguyên nhân chính gây `SecurityException: Permission Denial` làm ứng dụng lập tức bị hệ điều hành dừng khi Shizuku kết nối).
               - Tự động dùng Shizuku Provider chính quy từ thư viện gốc, tương thích hoàn hảo mọi dòng máy (Infinix Note 30, Xiaomi, Samsung và các giả lập PC).
            2. **KHẮC PHỤC LỖI CẢM ỨNG & KÉO THẢ GAME TURBO HUD**:
               - Sửa lỗi dispatch `onTouch` trả về `false` ở sự kiện `ACTION_DOWN` khiến dock nổi bị liệt cảm ứng hoặc không mở được trên một số máy.
               - Giờ đây chỉ cần 1 chạm nhẹ vào tab mép màn hình `[⚡ TURBO]` là mở ngay Control Center, vuốt là kéo mượt mà và tự hút dính vào mép viền.
            3. **LOẠI BỎ 100% DỊCH VỤ TRỢ NĂNG (ACCESSIBILITY SERVICE)**:
               - Xóa sạch mã nguồn Trợ năng, không còn thông báo yêu cầu quyền Trợ năng hay "Cài đặt bị hạn chế" làm phiền.
               - Động cơ thực thi chuyển sang 100% Shizuku / Gỡ lỗi qua Wi-Fi / Root: Chạy trực tiếp bằng privileged shell binder (`input tap X Y; sleep ...`) với độ trễ 0ms.
            4. **GAME TURBO HUD THEO PHONG CÁCH REDMI / XIAOMI / REDMAGIC**:
               - **Gán vị trí chiêu (Target points)**: Bấm `[+ Ghim Điểm]`, kéo thả các điểm (1, 2, 3...) vào nút chiêu trong game, sau đó bấm `[🚀 TẠO NÚT BẤM TURBO]` để tạo nút tròn nổi `[⚡]`.
               - **Ghi thao tác (Touch Recorder)**: Nút `[🔴 BẮT ĐẦU GHI (START)]` và `[⏹️ DỪNG GHI (STOP)]` rõ ràng với visual marker số thứ tự trực quan trên màn hình.

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.2.5.apk`** ở mục **Assets** bên dưới.
            2. Cài đặt vào điện thoại hoặc trình giả lập PC.
            3. Khởi động Shizuku (hoặc Root), mở app và tận hưởng tốc độ Game Turbo!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
