name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.1' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.1' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Fast Combo Controller) - Bản Release v1.2.1 (Hiển Thị Trực Quan Vị Trí Ghi & Tự Tạo Nút Tròn Macro)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🛠️ CÁC TÍNH NĂNG MỚI & SỬA LỖI TRỌNG YẾU TRONG BẢN v1.2.1:
            1. **Hiển thị trực quan toàn bộ các vị trí đã nhấn hoặc vuốt khi ghi Macro**:
               - Mọi điểm Chạm (Tap) được đánh số thứ tự (1, 2, 3...) với vòng tròn phát sáng cyan neon rõ nét, căn tỷ lệ theo mật độ màn hình (density).
               - Mọi điểm Giữ (Hold) hiển thị vòng neon tím kèm thời lượng giữ tính bằng mili-giây.
               - Mọi vệt Vuốt (Swipe) hiển thị đường đứt nét emerald green kèm mũi tên định hướng và điểm bắt đầu đánh số.
               - Hỗ trợ nút **↩ Xóa điểm** (Undo) để xóa ngay thao tác vừa bấm nhầm mà không cần ghi lại từ đầu.
            2. **Tự động tạo 1 nút tròn Macro nổi trên màn hình**:
               - Khi bấm **✓ Tạo nút Macro**, hệ thống lưu ngay combo với tốc độ xả chiêu siêu nhanh (5x Gaming Speed).
               - Tự động sinh một nút tròn nổi (56dp x 56dp, oval neon) ngay trên màn hình game.
               - Người chơi chỉ cần kéo nút tròn này đến vị trí thuận tay (gần nút đánh thường hoặc chiêu thức) và chạm vào nút là combo lập tức được xả ra!
            3. **Khắc phục triệt để lỗi Crash & Số nguyên toInt()**:
               - Sửa lỗi `Integer.parseInt` trong lệnh shell `input tap` / `input swipe` (chuyển đổi float sang int tuyệt đối an toàn).
               - Đảm bảo `Path` trong `GestureDescription` không bị rỗng (`lineTo`) trên mọi phiên bản Android.
               - Bọc luồng UI an toàn cho các Shizuku listener, chống hoàn toàn hiện tượng văng "Ứng dụng đã dừng".

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.2.1.apk`** ở mục **Assets** bên dưới.
            2. Cài đặt vào điện thoại hoặc kéo thả trực tiếp vào trình giả lập trên máy tính (LDPlayer, BlueStacks, Nox).
            3. Mở ứng dụng và bắt đầu tận hưởng combo chớp nhoáng!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
