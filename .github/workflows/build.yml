name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.3.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.3.0' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release v2.3.0)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 TÍNH NĂNG VÀ CẢI TIẾN TRỌNG TÂM TRÊN V2.3.0:
            1. **GIAO DIỆN BASIC, TỐI GIẢN & MƯỢT MÀ**:
               - Thiết kế lại toàn bộ màn hình chính (`activity_main`) và Game Turbo Dock (`view_floating_dock`) theo phong cách Cyberpunk tối giản, loại bỏ hoàn toàn các khối chữ hướng dẫn rườm rà.
               - Các nút chức năng to rõ, bố cục trực quan, thao tác nhanh trong trận chỉ mất 1-2 giây.
            2. **ĐIỀU KHIỂN NHANH TỪ THANH THÔNG BÁO (NOTIFICATION SHADE)**:
               - Vuốt từ đỉnh màn hình xuống là có ngay 3 nút điều khiển trực tiếp:
                 * `[👁️ ẨN NÚT]` / `[👁️ HIỆN NÚT]`: Ẩn/Hiện tức thì toàn bộ nút nổi mà không cần mở menu.
                 * `[🔴 Ghi Combo]`: Bắt đầu phiên ghi combo thời gian thực trực tiếp từ thanh thông báo.
                 * `[✕ Tắt Turbo]`: Đóng hoàn toàn dịch vụ Game Turbo ngay lập tức.
            3. **TÙY CHỈNH TÊN COMBO & ĐỔI TÊN LINH HOẠT**:
               - Hộp thoại lưu combo mới sau khi ghi: Cho phép game thủ đặt tên tùy thích (VD: "Florentino", "Đổi đồ 0.1s", "Raz", "Chiêu 1-2") và chọn tốc độ xả combo (1.0x, 1.5x, 2.0x).
               - Đổi tên bất kỳ lúc nào qua nút `[✏️ Sửa]` trong danh sách hoặc trong menu cài đặt nút.
            4. **NÚT ẨN MỜ (GHOST MODE TRONG SUỐT)**:
               - Chuyển đổi nhanh các mức độ mờ: 30% (mờ sương, nhìn xuyên thấu không che tầm nhìn), 50%, 80%, 100%.
               - Cho phép ẩn/hiện từng nút riêng biệt với nút `[👁️]` trong danh sách.
            5. **KHẮC PHỤC TRIỆT ĐỂ LỖI LOẠN CẢM ỨNG & SAI TỌA ĐỘ KHI LƯU COMBO**:
               - Đồng bộ frame cảm ứng phần cứng qua `SYN_REPORT`: Chỉ chốt tọa độ khi đã nhận đầy đủ sự kiện cảm ứng.
               - Chuẩn hóa tỷ lệ tọa độ theo phân giải thực tế `getRealMetrics` và góc xoay ngang Landscape (90° và 270°).
               - Tự động nhận diện cú chạm đơn lẻ (khoảng cách di chuyển < 25dp) là thao tác TAP tĩnh, hoàn toàn không bị trượt camera hay lệch joystick.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.3.0.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
