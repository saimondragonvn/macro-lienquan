name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.2' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.2' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Fast Combo Controller) - Bản Release v1.2.2 (Đặc Trị Crash & Tối Ưu Riêng Cho Infinix Note 30 / XOS)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🛠️ CÁC SỬA LỖI & NÂNG CẤP CHUYÊN NGHIỆP TRONG BẢN v1.2.2:
            1. **Đặc trị 100% lỗi Crash trên máy Infinix Note 30 (Transsion XOS 13/14)**:
               - Loại bỏ hoàn toàn lệnh kiểm tra Root đồng bộ trên Main Thread làm treo máy / ANR ("Ứng dụng đã dừng").
               - Bổ sung ServiceCompat và ForegroundServiceType an toàn cho Android 13/14, khắc phục triệt để lỗi ForegroundServiceDidNotStartInTimeException.
               - Gỡ bỏ bộ bắt lỗi đóng băng Main Looper, chuyển sang cơ chế ghi nhận chẩn đoán sạch sẽ.
            2. **Nâng cấp toàn diện giao diện Cyberpunk Gaming**:
               - Tự động nhận diện thiết bị: Hiển thị badge "Thiết bị: Infinix Note 30 (XOS) • 120Hz Fast Combo" trực tiếp trên màn hình chính.
               - Bổ sung Banner đặc quyền cho Infinix: Hướng dẫn mở khóa "Cài đặt bị hạn chế" (Restricted Settings) và "Cửa sổ thả nổi" (Floating Window) chỉ với 1 cú click!
               - Đèn LED trạng thái hệ thống: Báo "SẴN SÀNG" hoặc "CHƯA CẤP ĐỦ" tức thì.
            3. **Ghi hình trực quan & Tự tạo nút tròn Macro**:
               - Hiển thị rõ nét các điểm Chạm (1, 2, 3...), Giữ (Hold) và Vuốt (Swipe) kèm nút hoàn tác (Undo).
               - Bấm lưu là có ngay nút tròn nổi (56dp x 56dp) trên màn hình game để xả chiêu với tốc độ 5x!

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.2.2.apk`** ở mục **Assets** bên dưới.
            2. Cài đặt vào điện thoại Infinix Note 30 hoặc trình giả lập PC.
            3. Mở ứng dụng, bấm nút mở khóa Cài đặt bị hạn chế và bắt đầu chiến game!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
