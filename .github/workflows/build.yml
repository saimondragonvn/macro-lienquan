name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Fast Combo Controller) - Bản Release v1.2.0 (Fix Triệt Để Lỗi Crash & Hỗ Trợ Giả Lập PC)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🛠️ CÁC SỬA LỖI & NÂNG CẤP TRỌNG YẾU TRONG BẢN v1.2.0:
            1. **Khắc phục 100% lỗi "Ứng dụng đã dừng" (Crash) khi cấp quyền Shizuku**:
               - Bổ sung `dev.rikka.shizuku:provider:13.1.5` và khai báo `ShizukuProvider` vào `AndroidManifest.xml`.
               - Chuyển sang sử dụng `Shizuku.addBinderReceivedListenerSticky` chuẩn xác, nhận Binder an toàn tuyệt đối.
               - Cơ chế tự phục hồi chống crash toàn cục (`UncaughtExceptionHandler`) ngăn ngừa ứng dụng bị đóng đột ngột.
            2. **Hỗ trợ toàn diện máy ảo / giả lập Android trên máy tính (PC)**:
               - Hạ `minSdk = 26` (Android 8.0 Oreo), tương thích hoàn toàn với LDPlayer 9, BlueStacks 5, NoxPlayer, MuMu Player và tất cả điện thoại Android 8 -> Android 15.
               - Tự động nhận diện quyền Root (`su`) phổ biến trên các trình giả lập: Người dùng giả lập chỉ cần 1 cú click là tự động cấp toàn bộ quyền và chạy macro mượt mà không cần cài đặt Shizuku!
            3. **Tự động kích hoạt Trợ năng 1-chạm**:
               - Nhấn nút "Cấp quyền Trợ năng" trên màn hình chính sẽ tự kích hoạt ngay lập tức qua Shizuku/Root mà không cần tìm kiếm trong Cài đặt hệ thống.
            4. **Đa điểm & Ghi hình trực quan**:
               - Bản đồ xem trước thao tác (`GesturePreviewCanvas`) hiển thị rõ ràng từng nút bấm, vuốt chiêu và độ trễ.
               - Không xung đột Joystick di chuyển khi thi triển combo.

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.2.0.apk`** ở mục **Assets** bên dưới.
            2. Cài đặt vào điện thoại hoặc kéo thả trực tiếp vào trình giả lập trên máy tính (LDPlayer, BlueStacks, Nox).
            3. Mở ứng dụng và bắt đầu tận hưởng combo chớp nhoáng!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
