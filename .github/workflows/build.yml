name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.2' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.2' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release v2.0.2)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 CẢI TIẾN TRẢI NGHIỆM GAMEPLAY & MENU COMBO v2.0.2:
            1. **KHẮC PHỤC TRIỆT ĐỂ LỖI KHÔNG ẨN ĐƯỢC MENU**:
               - Tách riêng nút kéo thanh dock (`ivExpandedDrag`) khỏi tiêu đề để nút `[✕ Thu Gọn]` nhận diện click ngay tức khắc 100%.
               - Bổ sung nút `[— THU GỌN VỀ MÉP MÀN HÌNH]` lớn ở đáy bảng điều khiển.
               - Kích hoạt tính năng `[👁️ Ẩn/Hiện]`: 1 chạm để tạm ẩn toàn bộ các nút nổi trên màn hình khi combat, chạm vào mép để hiện lại.
            2. **MENU CHỈNH SỬA COMBO TRỰC TIẾP TRÊN MÀN HÌNH GAME**:
               - Nhấn giữ lâu nút tròn `[⚡ C1]` để mở **Menu Cài Đặt Combo**:
                 - Tùy chỉnh tốc độ xả chiêu: `30ms (Sát thủ)`, `60ms (Chuẩn)`, `120ms (Chậm)`.
                 - Số lần lặp lại: `1 lần`, `2 lần`, `3 lần`.
                 - Nút `[🎯 Hiện lại điểm ghim trên game]`: Tự động bung lại các điểm ①, ②, ③ lên các nút chiêu của game để bạn kéo chỉnh vị trí trực tiếp!
                 - Nút `[▶️ Thử chạy combo vào game]`: Thử nghiệm xả combo ngay tại chỗ!
            3. **TƯƠNG TÁC GAME HOÀN TOÀN TỰ NHIÊN**:
               - Khi gắn các điểm ghim ①, ②, ③, bạn chạm vào từng điểm để test thử chiêu đó ngay trong game!
               - Toàn bộ vùng màn hình game không bị chặn cảm ứng, đảm bảo bạn vừa di chuyển tướng vừa ngắm chiêu bình thường.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.0.2.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
