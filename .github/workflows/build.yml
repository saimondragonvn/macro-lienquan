name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.6.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.6.0' }}
          body: |
            ### 🍏 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.6.0' }})
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 💎 GIAO DIỆN iOS 26 LIQUID GLASS SIÊU THỰC & BẢN QUYỀN CRE: GIAHOAI:
            1. **NÚT MACRO THẤU KÍNH LỎNG 5 TẦNG (OPTICAL ACTION ORB)**:
               - Lớp đế kính Sapphire mờ sẫm trong suốt quang học cao (High Refraction Translucent Glass).
               - Đường viền phản quang khúc xạ kim cương siêu mảnh 1.0dp (`Specular Rim Light`).
               - Tán sắc ánh sáng ngọc bích nội thể (`Cyan Caustic Glow`) và ánh quang đáy giọt nước (`Bottom Ambient Bounce`).
               - Vòm lóa mặt cầu 3D (`Apple Curved Specular Dome Highlight`) cùng phản hồi nén xung lực ngọc bích khi kích hoạt.
            2. **MENU GAME TURBO HUD CHUẨN CONTROL CENTER LIQUID GLASS**:
               - Bo góc squircle liên tục 28dp, thanh kéo Apple Dynamic Grabber Bar.
               - Nền kính acrylic saphir tối bán trong suốt nhìn thấu khung cảnh trận đấu.
               - Phân nhóm Inset Glass Cards và hệ thống nút bấm viên nang kính lỏng.
            3. **TÍCH HỢP BẢN QUYỀN ĐỘC QUYỀN CRE: GIAHOAI**:
               - Huy hiệu kính lỏng `Cre: GiaHoai` trên Header Menu.
               - Thẻ kính phát quang `💎 iOS 26 LIQUID GLASS • CRE: GIAHOAI` ở Footer Menu.
               - Tab mép thu gọn `⚡ TURBO • GIAHOAI` và thẻ vinh danh trên màn hình chính.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.6.0.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
