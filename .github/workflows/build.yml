name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Fast Combo Controller) - Bản Release Chính Thức
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.0.1.apk`** ở mục **Assets** bên dưới về điện thoại.
            2. Mở file APK để cài đặt (cho phép "Cài đặt ứng dụng không rõ nguồn gốc" nếu điện thoại yêu cầu).
            3. Khởi động ứng dụng, cấp quyền **Trợ năng (Accessibility)** và **Hiển thị trên ứng dụng khác (Overlay)**.
            
            #### ⚠️ CÁCH MỞ KHÓA NẾU BỊ MỜ CÔNG TẮC TRỢ NĂNG (ANDROID 13/14+):
            Nếu vào phần Hỗ trợ tiếp cận mà thấy dòng chữ *"Cài đặt bị hạn chế"* (Restricted setting):
            - Bước 1: Vào **Cài đặt > Ứng dụng > Macro Gaming Combo** (hoặc nhấn nút *"Mở Cài đặt ứng dụng"* ngay trong app).
            - Bước 2: Bấm vào **dấu 3 chấm (⋮)** ở góc trên bên phải màn hình.
            - Bước 3: Chọn **"Cho phép cài đặt bị hạn chế"** (Allow restricted settings) và nhập mã PIN/vân tay.
            - Bước 4: Quay lại mục Trợ năng, công tắc đã sáng rõ và gạt **BẬT** bình thường!

            #### Tính năng nổi bật trong bản v1.0.1:
            - **Tên tệp chuẩn Release**: File APK mang tên `Macro-LienQuan-v1.0.1.apk`.
            - **Hộp thoại Hướng dẫn Mở khóa Trợ năng thông minh**: Trực tiếp hỗ trợ người dùng Android 13/14+.
            - **Cấu hình AccessibilityService chuẩn hóa**: Tương thích hoàn hảo với Samsung OneUI, Xiaomi HyperOS, Oppo ColorOS.
            - **Ghi thao tác thực tế**: Ghi nhận tọa độ và khoảng cách thời gian giữa các chiêu thức.
            - **Tăng tốc siêu tốc (Speed Multiplier 1x - 10x)**: Rút ngắn thời gian combo để tạo combo chớp nhoáng.
            - **Nút Macro Nổi độc lập**: Kéo thả nút cạnh phím chiêu, chạm là tự động xả combo.
            - **Đa điểm đồng thời (Multi-Touch)**: Tay trái vẫn di chuyển Joystick mượt mà trong khi macro đang xả skill.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
