name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - ${{ github.ref_name }}
            Bản build tự động cho game thủ Liên Quân Mobile / MOBA.
            
            #### Tính năng nổi bật:
            - Ghi thao tác combo thực tế và chỉnh tốc độ siêu tốc (Speed Multiplier 1x - 10x).
            - Lưu thành Nút Macro Nổi độc lập trên màn hình (kéo thả cạnh phím chiêu).
            - Đa điểm không cản trở: Tay trái vẫn di chuyển Joystick mượt mà trong khi macro đang xả skill.
            - Tương thích Android 11 (API 30) đến Android 14+ (API 34+).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
