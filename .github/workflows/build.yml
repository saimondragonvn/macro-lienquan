name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.3' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.3' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile (Fast Combo Controller) - Bản Release v1.2.3 (Khắc Phục Toàn Diện Lỗi Ghi Thao Tác & Crash Khi Vào Lại App)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🛠️ CÁC SỬA LỖI & ĐỘT PHÁ QUAN TRỌNG TRONG BẢN v1.2.3:
            1. **Khắc phục lỗi màn hình không hoạt động khi bắt đầu ghi thao tác**:
               - Bổ sung nút **(✓) Tạo nút Macro tròn** trực tiếp ngay trên thanh Dock nổi: Cho phép đặt các điểm ghim (1, 2, 3...) lên các nút chiêu mà KHÔNG HỀ chặn cảm ứng màn hình, bấm (✓) là tạo ngay nút tròn Macro!
               - Chế độ Ghi cử chỉ (Live Touch Recorder) được bọc ContextThemeWrapper an toàn 100%, thanh điều khiển dời xuống dưới tai thỏ/nốt ruồi (Punch hole camera) trên Infinix Note 30, nút Thoát và Lưu to rõ.
            2. **Khắc phục triệt để lỗi không vào lại được app và crash ("Ứng dụng đã dừng")**:
               - Bổ sung BroadcastReceiver lắng nghe sự kiện Home/Recent Apps/Tắt màn hình: Tự động đóng ngay lập tức màn hình ghi toàn màn hình, không bao giờ để lớp phủ vô hình che launcher hay chặn bấm icon app.
               - Sửa cờ `FLAG_ACTIVITY_NEW_TASK or FLAG_ACTIVITY_SINGLE_TOP` trong PendingIntent của Notification, xóa sổ hoàn toàn lỗi AndroidRuntimeException khi bấm vào lại app.
               - Thiết lập `android:launchMode="singleTask"` cho MainActivity giúp tái kích hoạt Activity mượt mà, không xung đột hoặc nhân bản tiến trình.
               - Nâng cấp `removeViewImmediate` giúp giải phóng bộ nhớ và giao diện overlay tức thì.

            #### 📲 Hướng dẫn cài đặt APK:
            1. Tải file **`Macro-LienQuan-v1.2.3.apk`** ở mục **Assets** bên dưới.
            2. Cài đặt vào điện thoại Infinix Note 30 hoặc trình giả lập PC.
            3. Mở ứng dụng, bấm nút Bật Dock Điều Khiển và quẩy game thôi!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
