name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.6.0' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.6.0' }}
          body: |
            ### ⚡ Macro Liên Quân Mobile - Game Turbo Pro (Bản Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.6.0' }})
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🎮 GIAO DIỆN TACTICAL GAMING HUD & BẢN QUYỀN CRE: GIAHOAI:
            1. **NÚT MACRO GAMING HUD SIÊU NÉT (TACTICAL TRIGGER BUTTON)**:
               - Vòng hào quang Neon Cyan 2.0dp sắc sảo, chống chìm màu khi giao tranh combat tổng.
               - Lõi Stealth Obsidian tương phản cao giúp nhìn rõ từng nút M1, M2 trên nền game.
               - Trạng thái kích hoạt (Active State): Bùng nổ lõi ngọc bích cực sáng cùng viền trắng phát quang.
            2. **BẢNG ĐIỀU KHIỂN GAME TURBO HUD CHUẨN CYBERPUNK**:
               - Giao diện đen nhám viền Neon sắc bén, tối ưu hiển thị nhanh, trực quan.
               - Hệ thống nút bấm và thẻ chọn game phong cách Redmi Turbo 4 Pro / ROG Phone.
            3. **TÍCH HỢP BẢN QUYỀN ĐỘC QUYỀN CRE: GIAHOAI**:
               - Huy hiệu `Cre: GiaHoai` trên Header Menu.
               - Thanh vinh danh `⚡ GAME TURBO PRO • CRE: GIAHOAI` ở Footer Menu.
               - Tab mép thu gọn `⚡ TURBO • GIAHOAI` và thẻ vinh danh trên màn hình chính.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.6.0.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
