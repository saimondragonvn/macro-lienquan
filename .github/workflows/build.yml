name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.4' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.4' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release v2.0.4)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🚀 CẢI TIẾN ĐỘT PHÁ v2.0.4:
            1. **BỘ NHỚ LƯU TRỮ CẤU HÌNH VĨNH VIỄN (PERSISTENT CONFIG STORAGE)**:
               - Tích hợp `MacroConfigStorage` lưu tự động mọi nút macro (tên, tọa độ X/Y, delay, repeat, opacity, danh sách điểm chiêu) vào `SharedPreferences` + `Gson`.
               - Tắt mở lại ứng dụng hoặc khởi động lại máy thì toàn bộ các nút đã tạo tự động phục hồi đúng vị trí chuẩn trên màn hình game.
            2. **QUẢN LÝ DANH SÁCH & XÓA TỪNG NÚT ĐỘC LẬP**:
               - Bảng điều khiển Game Turbo HUD hiển thị danh sách từng nút macro đã gán (`[C1]`, `[C2]`, `[R1]...`).
               - Nút `[🎯 Ghim]`: Tự động phục hồi lại các điểm ghim ①, ②, ③ lên chiêu để kéo căn chỉnh lại.
               - Nút `[🗑️ XÓA]`: Xóa vĩnh viễn từng nút một cách độc lập mà không ảnh hưởng các nút khác.
            3. **TÙY CHỈNH ĐỘ MỜ (OPACITY / TRONG SUỐT)**:
               - Bổ sung thanh chỉnh độ mờ toàn cục trên Game Turbo HUD: `30% Mờ`, `50% Vừa`, `80% Rõ`, `100% Đậm`.
               - Hỗ trợ chỉnh độ mờ riêng cho từng nút trong menu cài đặt combo để không che khuất tầm nhìn combat.
            4. **1-CHẠM KHỞI ĐỘNG LIÊN QUÂN MOBILE (TURBO MODE)**:
               - Nút `[🚀 MỞ LIÊN QUÂN MOBILE (TURBO MODE)]` trên cả màn hình chính lẫn Game Turbo HUD giúp tự động bật HUD và mở game Liên Quân chỉ với 1 chạm.
            5. **TỐI ƯU HÓA ĐỘNG CƠ SHIZUKU / ROOT & TƯƠNG TÁC GAME TUYỆT ĐỐI**:
               - Lệnh `input tap` + `swipe` dự phòng với xử lý luồng tránh nghẽn pipe buffer.
               - Tọa độ chiêu được hiệu chỉnh bằng `getLocationOnScreen()` bù trừ viền màn hình và tai thỏ trên điện thoại Infinix Note 30.
               - Cảnh báo trực quan Toast nếu Shizuku chưa kết nối hoặc chưa cấp quyền.

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.0.4.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
