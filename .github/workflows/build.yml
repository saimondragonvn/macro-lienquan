name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macro-LienQuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.1' }}
          name: Macro Liên Quân Mobile - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.1' }}
          body: |
            ### 🎮 Macro Liên Quân Mobile - Game Turbo Pro (Bản Release v2.0.1)
            Bản cài đặt APK hoàn chỉnh đã được ký số (Signed Release) từ commit `${{ github.sha }}`.

            #### 🛠️ CÁC CẢI TIẾN VÀ BẢN VÁ QUAN TRỌNG TRONG v2.0.1:
            1. **KHẮC PHỤC TRIỆT ĐỂ LỖI CẤP QUYỀN SHIZUKU**:
               - Bổ sung `rikka.shizuku.ShizukuProvider` vào `AndroidManifest.xml` giúp truyền Binder IPC an toàn giữa Shizuku Manager và ứng dụng.
               - Tự động nhận diện kết nối Shizuku qua `addBinderReceivedListenerSticky`.
               - Hỗ trợ 1-chạm mở app Shizuku nếu dịch vụ chưa chạy trên máy.
            2. **KHẮC PHỤC LỖI CRASH KHI BẬT GAME TURBO HUD**:
               - Loại bỏ hoàn toàn các thuộc tính theme phụ thuộc (`?attr/selectableItemBackgroundBorderless`, `android:tint`) trong layout overlay.
               - Đảm bảo toàn bộ View cửa sổ nổi được render an toàn với `ContextThemeWrapper(context, R.style.Theme_MacroGaming)`.
               - Bọc try-catch tuyệt đối cho `WindowManager.addView` và `startForeground`.
            3. **GỠ BỎ HƯỚNG DẪN 3 CHẤM (⋮) GÂY NHẦM LẪN TRÊN INFINIX NOTE 30**:
               - Vì ứng dụng đã loại bỏ hoàn toàn Trợ năng (Accessibility Service), hệ thống Android/XOS không bao giờ giới hạn hay hiển thị menu 3 chấm.
               - Giao diện tinh gọn chỉ còn 2 bước rõ ràng: Cấp Cửa sổ nổi và Động cơ Shizuku / Root.
            4. **GAME TURBO HUD 120HZ**:
               - Gán vị trí chiêu: Kéo các điểm (1, 2, 3...) vào nút chiêu $\rightarrow$ Bấm `[🚀 TẠO NÚT BẤM TURBO]`.
               - Nút tròn `[⚡]` hiển thị trên màn hình: Chạm để xả combo với độ trễ 0ms!

            #### 📲 Tải về APK:
            Tải file **`Macro-LienQuan-v2.0.1.apk`** ở mục **Assets** bên dưới.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
